[package]
name = "surfing-studio-launcher"
version = "1.3.5-a"
edition = "2024"
rust-version = "1.85"
description = "SurfingStudio thin launcher: loads the runtime DLL and calls its entry"
license = "GPL-3.0-only"

[[bin]]
name = "surfing-studio"
path = "src/main.rs"

[target.'cfg(not(target_os = "android"))'.dependencies]
libloading = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["winuser"] }
