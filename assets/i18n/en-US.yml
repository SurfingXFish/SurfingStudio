  "• {} 按当前编辑上下文全选；{} 切换自动翻页（播放时视图跟随播放头）": "• {} selects all in the current editor; {} toggles auto page (the view follows the playhead during playback)"
  "• VST2：选择 64 位 .dll，支持音频与 MIDI 处理及通用参数面板": "• VST2: pick a 64-bit .dll; audio/MIDI processing and a generic parameter panel are supported"
  "• VST3：自动扫描标准目录，支持原生编辑器与参数": "• VST3: standard folders are scanned automatically; native editors and parameters are supported"
  "• 插件状态会随工程一起保存（VST3 状态块 / VST2 参数快照）": "• Plugin state is saved with the project (VST3 state blocks / VST2 parameter snapshots)"
  "• 单击主轨或子轨只会选中（用于复制/粘贴）；双击才会进入编辑": "• A single click selects a track or sub-lane (for copy/paste); double-click enters editing"
  "• 顶部鼠标模式：选择 / 绘制 / 切割（默认快捷键 {} / {} / {}，按住 Shift 临时绘制）": "• Top pointer modes: Select / Draw / Cut (default shortcuts {} / {} / {}; hold Shift to draw temporarily)"
  "• 顶部应用栏：点击左上角的菜单按钮显示「文件 / 编辑 / VST 插件 / 帮助」，此时左上角只保留菜单；点击其他区域或按 Esc 收起": "• Top app bar: click the menu button at the top left to show File / Edit / VST Plugins / Help; the top left then keeps only the menu. Click elsewhere or press Esc to hide it"
  "• 独立卷帘支持多个、最小化/最大化、跨屏移动；再次双击同一轨道只会将其置顶": "• Detached editors support multiple windows, minimize/maximize and moving across screens; double-clicking the same track again only raises it"
  "• 轨道列表：Ctrl / Command 单击轨道头部多选；右键可创建组合轨道、渲染为音频、重新渲染、在下方插入轨道、修改乐器或删除轨道": "• Track list: Ctrl / Command-click track headers to multi-select; right-click to create a group track, render to audio, re-render, insert a track below, change the instrument or delete the track"
  "• 绘制：轨道内拖出新片段，钢琴卷帘内新建音符；切割：拆分片段/音符": "• Draw: drag inside a track to create a clip, or inside the piano roll to add notes; Cut: split clips/notes"
  "• 将 WAV 拖到主轨即可创建音频片段；轨道 → 添加音频轨道；音频支持音量/声像/弯音动态变调": "• Drag a WAV onto a track to create an audio clip; Track → Add audio track; audio supports volume/pan/pitch-bend dynamic pitch"
  "• 控制器卷帘画笔：画笔 / 直线 / 平滑 / 擦除（{} 循环切换，{} / {} / {} / {} 直接选择）": "• Controller roll brushes: Brush / Line / Smooth / Erase ({} cycles; {} / {} / {} / {} select directly)"
  "• 内置复音合成器（锯齿/方波/三角/正弦 + 滤波 + ADSR）": "• Built-in polyphonic synth (saw/square/triangle/sine + filter + ADSR)"
  "• 内置鼓机（底鼓/军鼓/闭镲/开镲/拍手/通鼓）": "• Built-in drum machine (kick/snare/closed hat/open hat/clap/tom)"
  "• 视图滑动：{} / {} 水平滑动，{} / {} 垂直滑动；效果器链支持滚轮 / Shift+滚轮左右滑动": "• View scrolling: {} / {} scroll horizontally, {} / {} vertically; the effect chain scrolls with the wheel / Shift+wheel"
  "• 双击 MIDI 片段 / 子轨 = 打开编辑卷帘；双击空白轨道 = 创建 MIDI 片段": "• Double-click a MIDI clip / sub-lane to open its editor; double-click an empty track to create a MIDI clip"
  "• 同一轨道不能混放 MIDI 与音频片段；子轨不支持时显示灰色并划去": "• A track cannot mix MIDI and audio clips; unsupported sub-lanes are greyed out and struck through"
  "• 拖动卷帘顶部工具条的空白处（按钮和滑块以外）可把卷帘拖出为独立窗口；画布上的拖动始终是框选/编辑": "• Drag the empty part of an editor toolbar (outside buttons and sliders) to detach it into its own window; dragging on the canvas always selects/edits"
  "• 项目栏显示工程名与未保存圆点，下拉可打开或新建工程；拖动应用栏移动窗口，双击应用栏最大化": "• The project chip shows the project name and an unsaved dot; its menu opens or creates projects. Drag the app bar to move the window; double-click it to maximize"
  "• 选择：拖动片段或音符；在空白处拖拽可框选（靠近边缘自动滚动，可选中屏幕外内容）": "• Select: drag clips or notes; drag on empty space to rubber-band select (auto-scrolls near the edges to reach off-screen content)"
  "• 选中子轨 / 效果器后按 {}，选中目标轨道后按 {} 即可复制（已有同名子轨时询问覆盖）": "• With a sub-lane / effect selected press {}, then select the target track and press {} to copy (asks before overwriting an existing sub-lane)"
  "• 右键菜单：编曲区 / 钢琴卷帘可剪切、复制、粘贴；{} = 删除选中项（片段/音符/效果器/控制器/节点），没有选中项时删除当前轨道；顶部「量化」按网格对齐": "• Context menus: cut, copy and paste in the arrangement / piano roll; {} deletes the selection (clips/notes/effects/controllers/nodes) or the current track when nothing is selected; Quantize aligns to the grid"
