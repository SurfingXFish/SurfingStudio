[package]
name = "surfing-ai-data"
version = "1.3.7"
edition = "2024"
rust-version = "1.85"
description = "SurfingStudio AI library storage DLL: agents as JSON, skills as Markdown"
license = "GPL-3.0-only"

[lib]
name = "surfing_ai_data"
path = "src/lib.rs"
# cdylib：安装包内的 `surfing_ai_data.dll`；rlib：单元测试直接链接。
# cdylib: the `surfing_ai_data.dll` shipped in the installer; rlib: linked by unit tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"
